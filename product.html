<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POWR Kit — POWR</title>
<meta name="description" content="Turn your phone into a velocity-based training device. The POWR Bar Clip fits any 50 mm Olympic sleeve.">
<meta name="theme-color" content="#000000">
<meta property="og:image" content="assets/img/og.jpg">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  @media (min-width: 901px) { .pdp { grid-template-columns: 1.25fr .75fr; } }
  .pdp-info { gap: 28px; }
  .pdp-info h1 { font-size: clamp(40px, 4.6vw, 64px); }
  .step-h { display: flex; align-items: baseline; gap: 12px; font: 600 13px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .step-h b { color: var(--text); font-weight: 600; }
  .step-h .sel { margin-left: auto; letter-spacing: .04em; text-transform: none; font: 500 14px/1 var(--f-body); color: var(--text-2); }
  .styles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .style-t { display: grid; justify-items: center; gap: 10px; padding: 16px 6px 12px; border-radius: 12px; border: 1px solid var(--line); background: #0a0a0a; color: var(--text-2); font-size: 12.5px; transition: border-color .2s, background .2s, color .2s; }
  .style-t:hover { border-color: var(--line-2); color: var(--text); }
  .style-t.on { border-color: #fff; color: var(--text); background: #111; }
  .style-t .kit-swatch i { width: 16px; height: 30px; }
  .customise { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .customise > summary { list-style: none; cursor: pointer; padding: 18px 0; display: flex; align-items: center; gap: 12px; }
  .customise > summary::-webkit-details-marker { display: none; }
  .customise > summary::after { content: "+"; margin-left: auto; font-size: 20px; color: var(--muted); transition: transform .3s var(--ease); }
  .customise[open] > summary::after { transform: rotate(45deg); }
  .customise .cfg { padding: 0 0 22px; gap: 20px; }
  .buy-row .btn { height: 56px; font-size: 13.5px; }
  .fine { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--muted); }
  .fine span::before { content: "✓"; margin-right: 8px; color: var(--text-2); }
  .spec-band { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .spec-band div { padding: 40px 24px 36px 0; display: grid; gap: 12px; }
  .spec-band div + div { padding-left: 24px; border-left: 1px solid var(--line); }
  .spec-band b { font: 600 clamp(48px, 5.4vw, 76px)/1 var(--f-num); letter-spacing: -0.01em; }
  .spec-band b small { font-size: .36em; color: var(--muted); margin-left: 4px; }
  .spec-band span { color: var(--text-2); max-width: 26ch; font-size: 15px; }
  .sticky-buy { display: flex; }
  .sticky-buy .kit-swatch i { width: 14px; height: 26px; }
  .sticky-buy .sb-txt { display: grid; gap: 2px; min-width: 0; }
  .sticky-buy .sb-txt b { font-size: 14px; }
  .sticky-buy .sb-txt span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sticky-buy .sb-p { margin-left: auto; font: 600 22px/1 var(--f-num); }
  .sticky-buy .btn { margin-left: 0; }
  @media (max-width: 900px) { .spec-band { grid-template-columns: 1fr 1fr; } .spec-band div:nth-child(3) { border-left: 0; padding-left: 0; } .spec-band div:nth-child(n+3) { border-top: 1px solid var(--line); } }
  @media (max-width: 560px) { .styles { grid-template-columns: repeat(4, 1fr); gap: 6px; } .style-t { font-size: 11px; padding: 12px 2px 10px; } .sticky-buy .sb-txt span, .sticky-buy .sb-p { display: none; } }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body data-page="shop">

<main class="wrap">
  <div class="crumbs" style="padding-top:28px"><a href="index.html" data-es="Inicio">Home</a><span>/</span><a href="shop.html" data-es="Tienda">Shop</a><span>/</span><span id="crumbName"></span></div>
  <div class="pdp">
    <div class="gallery">
      <div class="gallery-main" id="stage"></div>
      <div class="thumbs" id="thumbs"></div>
      <p class="xs muted" data-es="Fotos: un clip impreso en negro, en el gimnasio. Vista 3D y última imagen: CAD de producción.">Photos: a printed clip in black, at the gym. 3D view and last image: the production CAD.</p>
    </div>
    <div class="pdp-info" id="info"></div>
  </div>
</main>

<section class="section" id="extra"></section>

<section class="section" style="padding-top:0">
  <div class="wrap">
    <div class="cta-band">
      <div style="position:relative;display:grid;gap:14px">
        <span class="eyebrow" data-es="Para gimnasios">For gyms</span>
        <h2 data-es="¿Tienes un gimnasio?">Own a gym?</h2>
        <p class="lede" data-es="Etiquetamos tus máquinas, damos de alta tu gimnasio en la app y tus socios compiten en rankings.">We tag your machines, list your gym in the app and your members compete on leaderboards.</p>
      </div>
      <div class="actions"><a class="btn" href="gyms.html" data-es="POWR para gimnasios →">POWR for gyms →</a></div>
    </div>
  </div>
</section>

<div class="sticky-buy" id="stickyBuy"><span id="sbSwatch"></span><div class="sb-txt"><b id="sbName"></b><span id="sbCombo"></span></div><span class="sb-p" id="sbPrice"></span><button class="btn" id="sbAdd" data-es="Añadir a la cesta">Add to bag</button></div>

<script src="assets/js/catalog.js"></script>
<script src="assets/js/app.js"></script>
<script type="module">
  const { t, money, add, observe } = window.POWR;
  const P = window.POWR_PRODUCTS;
  const qs = new URLSearchParams(location.search);
  let id = qs.get('id');
  if (!P[id]) id = 'kit';
  const p = P[id];

  const GALLERY = {
    // 3D = the configurator (rev J STL). Then real photos of a printed rev J at the gym (2-Oct-2026,
    // docs/media/gym_2026-10-02), and one CAD render of the parts apart.
    kit: ['3d', 'assets/img/real/bar-side-1200.webp', 'assets/img/real/clip-sleeve-1200.webp', 'assets/img/real/clip-top-1200.webp', 'assets/img/kit-complete.jpg'],
  };
  const SPECS = {
    kit: [['Support', 'POWR Bar Clip rev J: clip + MagSafe plate, PETG, ≈ 36 g', 'POWR Bar Clip rev J: clip + placa MagSafe, PETG, ≈ 36 g', 'Soporte'], ['Fits', 'Olympic sleeves Ø49.2–50.8 mm', 'Manguitos olímpicos Ø49,2–50,8 mm', 'Compatible'], ['Hold', '≥ 28 N pull-off on the thinnest sleeve, sweaty', '≥ 28 N de arranque en el manguito más fino, con sudor', 'Sujeción'], ['Magnet ring', 'Metal, 55 × 45 mm, on a Ø56 plate', 'Metálico, 55 × 45 mm, sobre placa de Ø56', 'Anillo magnético'], ['Phone ring', 'Adhesive, MagSafe size (Ø46–54 mm)', 'Adhesivo, tamaño MagSafe (Ø46–54 mm)', 'Anillo del móvil'], ['Grip', '4 silicone strips in the bore, replaceable', '4 tiras de silicona en el interior, reemplazables', 'Agarre'], ['Colours', 'Clip and plate in any of 12 PETG colours, 4 ring finishes', 'Clip y placa en cualquiera de 12 colores de PETG, 4 acabados de anillo', 'Colores'], ['Made in', 'Spain, printed to order', 'España, impreso por encargo', 'Fabricado en']],
  };

  document.title = `${p.name} — POWR`;
  const K = p.custom || null;
  const partsOf = (cid) => POWR.customParts(id, cid);
  // ?c=clip.plate.ring opens on that combination (the home page's preset swatches link here).
  const asked = qs.get('c');
  let color = K ? (partsOf(asked) ? asked : K.presets[0].id) : p.colors ? p.colors[0].id : null;
  let qty = 1;
  let viewer = null;

  const swatchOf = (cid) => { const k = partsOf(cid); return k ? `<span class="kit-swatch" aria-hidden="true"><i style="background:${k.clip.hex}"></i><i style="background:${k.plate.hex}"></i><i style="background:${k.ring.hex}"></i></span>` : ''; };
  const styleName = (cid) => { const pr = K && K.presets.find((x) => x.id === cid); return pr ? t(pr.en, pr.es) : t('Custom', 'Personalizado'); };
  const comboText = (cid) => { const k = partsOf(cid); return k ? [k.clip, k.plate, k.ring].map((x) => t(x.en, x.es)).join(' · ') : POWR.colorName(id, cid); };

  function renderInfo() {
    document.getElementById('crumbName').textContent = p.name;
    const box = (POWR.lang() === 'es' ? p.boxEs : p.boxEn) || [];
    const specs = SPECS[id];
    document.getElementById('info').innerHTML = `
      <div style="display:grid;gap:14px">
        <h1>${p.name}</h1>
        <p class="lede">${t(p.shortEn, p.shortEs)}</p>
        <div class="price" style="font-size:40px;margin-top:6px">${money(p.price)}<small>${t('VAT included · Free shipping over €40', 'IVA incluido · Envío gratis desde 40 €')}</small></div>
      </div>
      ${K ? cfgHTML() : p.colors ? `<div class="opt-group"><span>${t('Colour', 'Color')}: <b style="color:var(--text)" id="colorName">${POWR.colorName(id, color)}</b></span><div class="swatches">${p.colors.map((c) => `<button class="swatch${c.id === color ? ' on' : ''}" data-color="${c.id}" data-hex="${c.hex}"><i style="background:${c.hex}"></i>${t(c.en, c.es)}</button>`).join('')}</div></div>` : ''}
      <div class="buy-row">
        <div class="qty"><button id="qm" aria-label="-">−</button><span id="qv">${qty}</span><button id="qp" aria-label="+">+</button></div>
        <button class="btn" id="addBtn">${t('Add to bag', 'Añadir a la cesta')} · <span id="addPrice">${money(p.price * qty)}</span></button>
      </div>
      <div class="fine"><span>${t('Ships in 2–4 days', 'Envío en 2–4 días')}</span><span>${t('30-day returns', '30 días de devolución')}</span><span>${t('3-year warranty', '3 años de garantía')}</span></div>
      <div class="acc">
        <details><summary>${t("What's in the box", 'Qué incluye')}</summary><div class="acc-body"><ul class="ticks">${box.map((b) => `<li><span>${b}</span></li>`).join('')}</ul></div></details>
        ${specs ? `<details><summary>${t('Specifications', 'Especificaciones')}</summary><div class="acc-body"><table class="spec">${specs.map((s) => `<tr><td>${t(s[0], s[3] || s[0])}</td><td>${t(s[1], s[2])}</td></tr>`).join('')}</table></div></details>` : ''}
        <details><summary>${t('Compatibility', 'Compatibilidad')}</summary><div class="acc-body"><p>${t('MagSafe iPhones (12 and later) snap on directly. Any other phone works with the magnetic ring stuck to its case. The POWR app is in beta on iPhone — every order includes access.', 'Los iPhone con MagSafe (12 y posteriores) se enganchan directamente. Cualquier otro móvil funciona con el anillo magnético pegado a su funda. La app POWR está en beta para iPhone — cada pedido incluye acceso.')}</p></div></details>
        <details><summary>${t('Shipping & returns', 'Envíos y devoluciones')}</summary><div class="acc-body"><p>${t('Spain (peninsula) 2–4 working days · EU 4–7 days · free pickup in Madrid. Free shipping over €40. Return within 30 days for a full refund.', 'España península 2–4 días laborables · UE 4–7 días · recogida gratis en Madrid. Envío gratis desde 40 €. Devuélvelo en 30 días y te reembolsamos todo.')} <a style="text-decoration:underline" href="legal.html#shipping">${t('Details', 'Detalles')}</a></p></div></details>
      </div>`;
    wire();
    renderSticky();
  }

  /* ---- step 1: a style (preset); step 2, folded away: a colour per part ---- */
  function cfgHTML() {
    const k = partsOf(color);
    const isPreset = K.presets.some((x) => x.id === color);
    const row = (part, list, metal) => `<div class="cfg-row"><span>${{ clip: t('Clip', 'Clip'), plate: t('Plate', 'Placa'), ring: t('Magnet ring', 'Anillo magnético') }[part]}: <b data-name="${part}">${t(k[part].en, k[part].es)}</b></span>
      <div class="dots" role="radiogroup" aria-label="${part}">${list.map((c) => `<button class="dot${metal ? ' metal' : ''}${c.id === k[part].id ? ' on' : ''}" role="radio" aria-checked="${c.id === k[part].id}" data-part="${part}" data-id="${c.id}" title="${t(c.en, c.es)}" aria-label="${t(c.en, c.es)}"><i style="background-color:${c.hex}"></i></button>`).join('')}</div></div>`;
    return `<div>
        <div class="step-h"><b>1</b>${t('Style', 'Estilo')}<span class="sel" id="styleSel">${styleName(color)}</span></div>
        <div class="styles">${K.presets.map((pr) => `<button class="style-t${pr.id === color ? ' on' : ''}" data-preset="${pr.id}">${swatchOf(pr.id)}${t(pr.en, pr.es)}</button>`).join('')}</div>
      </div>
      <details class="customise"${isPreset ? '' : ' open'}>
        <summary><span class="step-h"><b>2</b>${t('Customise each part', 'Personaliza cada pieza')}</span></summary>
        <div class="cfg">${row('clip', K.plastics)}${row('plate', K.plastics)}${row('ring', K.rings, true)}
          <p class="xs muted">${t('Printed in PETG to order. The silicone grip strips are black.', 'Impreso en PETG por encargo. Las tiras de silicona son negras.')}</p></div>
      </details>`;
  }
  function applyKit(next) {
    color = next;
    const k = partsOf(color);
    ['clip', 'plate', 'ring'].forEach((part) => {
      document.querySelectorAll(`.dot[data-part="${part}"]`).forEach((d) => { const on = d.dataset.id === k[part].id; d.classList.toggle('on', on); d.setAttribute('aria-checked', on); });
      const n = document.querySelector(`[data-name="${part}"]`); if (n) n.textContent = t(k[part].en, k[part].es);
    });
    document.querySelectorAll('.style-t').forEach((b) => b.classList.toggle('on', b.dataset.preset === color));
    const sel = document.getElementById('styleSel'); if (sel) sel.textContent = styleName(color);
    if (viewer) viewer.setColors({ clip: k.clip.hex, plate: k.plate.hex, ring: k.ring.hex });
    if (items[0] === '3d' && viewerEl && viewerEl.style.display === 'none') show(0);
    history.replaceState(null, '', `?id=${id}&c=${color}`);
    renderSticky();
  }
  function wire() {
    document.querySelectorAll('.style-t').forEach((b) => b.addEventListener('click', () => applyKit(b.dataset.preset)));
    document.querySelectorAll('.dot').forEach((b) => b.addEventListener('click', () => {
      const parts = color.split('.'); parts[{ clip: 0, plate: 1, ring: 2 }[b.dataset.part]] = b.dataset.id;
      applyKit(parts.join('.'));
    }));
    document.querySelectorAll('.swatch').forEach((b) => b.addEventListener('click', () => {
      color = b.dataset.color;
      document.querySelectorAll('.swatch').forEach((x) => x.classList.toggle('on', x === b));
      document.getElementById('colorName').textContent = POWR.colorName(id, color);
      if (viewer) { viewer.setColor(b.dataset.hex); show(0); }
      renderSticky();
    }));
    const upd = () => { document.getElementById('qv').textContent = qty; document.getElementById('addPrice').textContent = money(p.price * qty); renderSticky(); };
    document.getElementById('qm').onclick = () => { qty = Math.max(1, qty - 1); upd(); };
    document.getElementById('qp').onclick = () => { qty = Math.min(20, qty + 1); upd(); };
    document.getElementById('addBtn').onclick = () => add(id, qty, color);
  }
  function renderSticky() {
    document.getElementById('sbSwatch').innerHTML = swatchOf(color);
    document.getElementById('sbName').textContent = K ? `${p.name} · ${styleName(color)}` : p.name;
    document.getElementById('sbCombo').textContent = comboText(color);
    document.getElementById('sbPrice').textContent = money(p.price * qty);
  }
  document.getElementById('sbAdd').onclick = () => add(id, qty, color);

  /* ---- gallery ---- */
  const stage = document.getElementById('stage'), thumbs = document.getElementById('thumbs');
  const items = GALLERY[id] || [p.img];
  let viewerEl = null;
  thumbs.innerHTML = items.map((src, i) => `<button class="thumb${i === 0 ? ' on' : ''}" data-i="${i}" aria-label="View ${i + 1}">${src === '3d' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg>' : `<img src="${src.replace('-1200.webp', '-480.webp')}" alt="" loading="lazy">`}</button>`).join('');
  thumbs.addEventListener('click', (e) => { const b = e.target.closest('.thumb'); if (b) show(+b.dataset.i); });

  async function show(i) {
    thumbs.querySelectorAll('.thumb').forEach((b, j) => b.classList.toggle('on', i === j));
    const src = items[i];
    [...stage.children].forEach((c) => { if (c !== viewerEl) c.remove(); });
    if (src === '3d') {
      if (!viewerEl) {
        viewerEl = document.createElement('div'); viewerEl.style.cssText = 'position:absolute;inset:0';
        stage.appendChild(viewerEl);
        try {
          if (K) {
            const { mountConfigurator } = await import('./assets/js/configurator.js');
            const k = partsOf(color);
            viewer = await mountConfigurator(viewerEl, { clip: k.clip.hex, plate: k.plate.hex, ring: k.ring.hex });
            // The colour may have changed while the model loaded.
            const now = partsOf(color); viewer.setColors({ clip: now.clip.hex, plate: now.plate.hex, ring: now.ring.hex });
          } else {
            const { mountViewer, CLIP_STRIPS, CLIP_BAR_RADIUS } = await import('./assets/js/viewer.js');
            const hex = (p.colors.find((c) => c.id === color) || p.colors[0]).hex;
            viewer = await mountViewer(viewerEl, { parts: [{ url: p.model, color: hex }], bar: 'x', cameraDist: 270, barLength: 150, tilt: 0.42, strips: CLIP_STRIPS, barRadius: CLIP_BAR_RADIUS });
          }
        } catch { viewerEl.innerHTML = `<img src="${p.img}" alt="" style="width:100%;height:100%;object-fit:cover">`; }
      }
      viewerEl.style.display = '';
      stage.insertAdjacentHTML('beforeend', `<span class="tag hint">${t('Drag to rotate', 'Arrastra para girar')}</span>`);
      if (K && viewer && viewer.setApart) {
        const b = document.createElement('button');
        b.className = 'apart' + (viewer.isApart() ? ' on' : '');
        const label = () => (viewer.isApart() ? t('Put it together', 'Montarlo') : t('Take it apart', 'Desmontarlo'));
        b.textContent = label();
        b.onclick = () => { viewer.setApart(!viewer.isApart()); b.textContent = label(); b.classList.toggle('on', viewer.isApart()); };
        stage.appendChild(b);
      }
    } else {
      if (viewerEl) viewerEl.style.display = 'none';
      stage.insertAdjacentHTML('beforeend', `<img src="${src}" alt="${p.name}">`);
    }
  }
  show(0);

  /* ---- the engineering, as numbers ---- */
  function renderExtra() {
    const ex = document.getElementById('extra');
    if (!id.includes('kit')) { ex.style.display = 'none'; return; }
    ex.innerHTML = `<div class="wrap">
      <div style="display:grid;gap:18px;margin-bottom:clamp(40px,6vw,72px);max-width:760px"><span class="eyebrow">${t('Engineering', 'Ingeniería')}</span><h2>${t('Built like a barbell collar.', 'Hecho como un collarín.')}</h2></div>
      <div class="spec-band reveal">
        <div><b>230<small>°</small></b><span>${t('of the sleeve, wrapped on four silicone strips.', 'del manguito, abrazado sobre cuatro tiras de silicona.')}</span></div>
        <div><b>36<small>g</small></b><span>${t('Stays on between sets. Off in a second.', 'Se queda puesto entre series. Se quita en un segundo.')}</span></div>
        <div><b>28<small>N</small></b><span>${t('Pull-off on the thinnest bar, with sweaty hands.', 'De arranque en la barra más fina, con sudor.')}</span></div>
        <div><b>50<small>mm</small></b><span>${t('Any Olympic sleeve, 49.2 to 50.8 mm.', 'Cualquier manguito olímpico, de 49,2 a 50,8 mm.')}</span></div>
      </div></div>`;
    observe(ex);
  }
  function all() { renderInfo(); renderExtra(); }
  all();
  document.addEventListener('powr:lang', all);

  /* ---- sticky bag bar once the main button scrolls away ---- */
  const sb = document.getElementById('stickyBuy');
  new IntersectionObserver(([e]) => sb.classList.toggle('on', !e.isIntersecting && e.boundingClientRect.top < 0)).observe(document.querySelector('.buy-row') || document.body);
</script>
</body>
</html>

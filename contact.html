<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — POWR</title>
<meta name="title-es" content="Contacto — POWR">
<meta name="description" content="Talk to POWR: orders, gyms, coaches, press and partnerships.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="contact">

<section class="page-hero">
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="wrap">
    <div class="crumbs"><a href="index.html" data-es="Inicio">Home</a><span>/</span><span data-es="Contacto">Contact</span></div>
    <h1 data-es="Hablemos.">Let's talk.</h1>
    <p class="lede" data-es="Pedidos, gimnasios, entrenadores, prensa o ideas. Respondemos en un día laborable.">Orders, gyms, coaches, press or ideas. We reply within one working day.</p>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="wrap">
    <div class="split" style="align-items:start">
      <div class="grid" style="gap:16px">
        <a class="card" href="https://www.instagram.com/powr.app/" target="_blank" rel="noopener" style="display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center">
          
          <div><h3 style="margin:0">Instagram</h3><p>@powr.app · <span data-es="la forma más rápida">the fastest way</span></p></div><span>→</span>
        </a>
        <a class="card" href="gyms.html#quote" style="display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center">
          
          <div><h3 style="margin:0" data-es="¿Tienes un gimnasio?">Own a gym?</h3><p data-es="Pide presupuesto con la calculadora">Get a quote with the estimator</p></div><span>→</span>
        </a>
        <div class="card" id="emailCard" style="display:none;grid-template-columns:1fr;gap:18px;align-items:center">
          
          <div><h3 style="margin:0">Email</h3><p><a id="emailLink" style="text-decoration:underline"></a></p></div>
        </div>
        <div class="card"><h4 data-es="Madrid, España">Madrid, Spain</h4><p data-es="Diseñamos, probamos y enviamos desde Madrid. Recogida en mano disponible.">We design, test and ship from Madrid. Local pickup available.</p></div>
      </div>
      <div class="card">
        <form class="form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" data-powr-form data-ok="Message sent — we'll reply within one working day." data-ok-es="Mensaje enviado — te respondemos en un día laborable.">
          <input type="hidden" name="form-name" value="contact">
          <p class="hp"><label>Leave empty <input name="bot-field"></label></p>
          <div class="field"><label for="m-topic" data-es="Tema">Topic</label>
            <select id="m-topic" name="topic">
              <option value="order" data-es="Un pedido">An order</option>
              <option value="gym" data-es="Mi gimnasio">My gym</option>
              <option value="coach" data-es="Soy entrenador / equipo">I'm a coach / team</option>
              <option value="press" data-es="Prensa y colaboraciones">Press &amp; partnerships</option>
              <option value="other" data-es="Otra cosa">Something else</option>
            </select></div>
          <div class="form-row">
            <div class="field"><label for="m-name" data-es="Nombre">Name</label><input id="m-name" name="name" required autocomplete="name"></div>
            <div class="field"><label for="m-email">Email</label><input id="m-email" type="email" name="email" required autocomplete="email"></div>
          </div>
          <div class="field"><label for="m-order"><span data-es="Nº de pedido">Order number</span> <span class="opt" data-es="(si aplica)">(if any)</span></label><input id="m-order" name="order_id" placeholder="PWR-XXXXXX"></div>
          <div class="field"><label for="m-msg" data-es="Mensaje">Message</label><textarea id="m-msg" name="message" required></textarea></div>
          <label class="check"><input type="checkbox" name="privacy" required><span data-es="Acepto la <a href='legal.html#privacy'>política de privacidad</a>.">I accept the <a href="legal.html#privacy">privacy policy</a>.</span></label>
          <button class="btn block" type="submit" data-es="Enviar mensaje">Send message</button>
          <p class="form-status"></p>
        </form>
      </div>
    </div>
  </div>
</section>

<script src="assets/js/catalog.js"></script>
<script src="assets/js/app.js"></script>
<script>
  const topic = new URLSearchParams(location.search).get('topic');
  if (topic) document.getElementById('m-topic').value = topic;
  const em = POWR_SETTINGS.email;
  if (em) { const c = document.getElementById('emailCard'); c.style.display = 'grid'; const a = document.getElementById('emailLink'); a.href = 'mailto:' + em; a.textContent = em; }
</script>
</body>
</html>
